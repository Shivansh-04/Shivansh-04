<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.5" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#120a24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    .m { font-family: 'Courier New', Consolas, monospace; }
    .l { opacity: 0; animation: in 0.5s forwards; }
    .d1 { animation-delay: 0.4s; } .d2 { animation-delay: 1.1s; }
    .d3 { animation-delay: 1.8s; } .d4 { animation-delay: 2.5s; }
    .d5 { animation-delay: 3.2s; }
    @keyframes in { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes dash { to { stroke-dashoffset: -2000; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .cur { animation: blink 1s infinite; }
    .border { stroke-dasharray: 400 1600; animation: dash 8s linear infinite; }
    .orb { animation: float 4s ease-in-out infinite; }
  </style>

  <rect x="10" y="10" width="980" height="300" rx="16" fill="url(#bg)"/>
  <rect x="10" y="10" width="980" height="300" rx="16" fill="url(#scan)"/>
  <rect x="10" y="10" width="980" height="300" rx="16" fill="none" stroke="url(#g)" stroke-width="2" class="border"/>
  <rect x="10" y="10" width="980" height="300" rx="16" fill="none" stroke="#00f5ff" stroke-opacity="0.15"/>

  <rect x="10" y="10" width="980" height="38" rx="16" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="38" cy="29" r="6" fill="#ff5f56"/>
  <circle cx="60" cy="29" r="6" fill="#ffbd2e"/>
  <circle cx="82" cy="29" r="6" fill="#27c93f"/>
  <text x="500" y="34" text-anchor="middle" class="m" font-size="13" fill="#8b949e">shivansh@rkgit: ~/profile</text>

  <circle cx="880" cy="160" r="70" fill="url(#g)" opacity="0.12" class="orb"/>
  <circle cx="880" cy="160" r="45" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.5" class="orb"/>
  <text x="880" y="172" text-anchor="middle" class="m orb" font-size="38" font-weight="bold" fill="url(#g)" filter="url(#glow)">&lt;/&gt;</text>

  <text x="40" y="85" class="m l d1" font-size="16"><tspan fill="#27c93f">➜</tspan><tspan fill="#00f5ff"> ~ </tspan><tspan fill="#c9d1d9">whoami</tspan></text>

  <text x="40" y="150" class="m l d2" font-size="58" font-weight="bold" fill="url(#g)" filter="url(#glow)">SHIVANSH GUPTA</text>

  <text x="40" y="190" class="m l d3" font-size="16"><tspan fill="#27c93f">➜</tspan><tspan fill="#00f5ff"> ~ </tspan><tspan fill="#c9d1d9">cat role.txt</tspan></text>
  <text x="40" y="222" class="m l d4" font-size="19" fill="#ff2e97">Full-Stack Developer · Competitive Programmer · AI Tinkerer</text>

  <text x="40" y="270" class="m l d5" font-size="16"><tspan fill="#27c93f">➜</tspan><tspan fill="#00f5ff"> ~ </tspan><tspan fill="#c9d1d9">echo "Code is my jutsu"</tspan><tspan fill="#00f5ff" class="cur"> █</tspan></text>
</svg>
